[build.environment]
  # sharp 0.35 needs Node 20.9+; Netlify functions default to the build's Node version.
  NODE_VERSION = "24"

[functions]
  external_node_modules = [
    "sharp"
  ]
  directory = "functions/"

[[edge_functions]]
  path = "/*"
  function = "metadata"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/render/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"