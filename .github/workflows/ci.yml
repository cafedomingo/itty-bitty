name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t itty-bitty .
      - run: docker run -d --name itty-bitty -p 8080:8080 itty-bitty
      - name: Smoke-test the container
        run: |
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q index.js
          curl -fsS http://localhost:8080/edit | grep -q edit.js
          curl -fsS -A Twitterbot http://localhost:8080/Hello/ | grep -q 'og:title" content="Hello"'
          svg=$(printf '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"/>' | base64 -w0)
          curl -fsS -o image.jpg -w '%{content_type}\n' "http://localhost:8080/.netlify/functions/rasterize?$svg" | grep -q image/jpeg
      - name: Stop within the grace period
        run: |
          start=$(date +%s)
          docker stop -t 10 itty-bitty
          [ $(( $(date +%s) - start )) -lt 5 ]
      - if: ${{ failure() }}
        run: docker logs itty-bitty
